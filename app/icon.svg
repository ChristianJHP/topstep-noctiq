<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- background -->
  <rect width="32" height="32" rx="7" fill="#0d1221"/>

  <!-- candle 1 — bearish (left, muted) -->
  <line x1="8" y1="10" x2="8" y2="13" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="5.5" y="13" width="5" height="7" rx="1" fill="#334155"/>
  <line x1="8" y1="20" x2="8" y2="23" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>

  <!-- candle 2 — bullish (middle, blue) -->
  <line x1="16" y1="6" x2="16" y2="10" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="13.5" y="10" width="5" height="9" rx="1" fill="#2563eb"/>
  <line x1="16" y1="19" x2="16" y2="22" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round"/>

  <!-- candle 3 — bullish (right, bright blue) -->
  <line x1="24" y1="4" x2="24" y2="7" stroke="#60a5fa" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="21.5" y="7" width="5" height="11" rx="1" fill="#3b82f6"/>
  <line x1="24" y1="18" x2="24" y2="21" stroke="#60a5fa" stroke-width="1.4" stroke-linecap="round"/>
</svg>
